name: test

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fpm@v5
        with:
          fpm-version: 'v0.10.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install f90wrap
        run: pip install git+https://github.com/itpplasma/f90wrap@fix/directc-prototype-mod-name

      - name: Build and install fpm-bind
        run: fpm install --prefix ~/.local

      - name: Test fpm bind on examples
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for dir in example/*/; do
            echo "=== Testing $dir ==="
            cd "$dir"
            fpm bind python
            ls -la build/bind/python/
            cd ../..
          done

  thirdparty:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: lazy-fortran/fortplot
            branch: feature/fpm-bind
    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fpm@v5
        with:
          fpm-version: 'v0.10.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install f90wrap
        run: pip install git+https://github.com/itpplasma/f90wrap@fix/directc-prototype-mod-name

      - name: Build and install fpm-bind
        run: fpm install --prefix ~/.local

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          path: thirdparty-test

      - name: Test fpm bind on ${{ matrix.repo }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd thirdparty-test
          fpm bind python
          ls -la build/bind/python/

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
