name: nightly

# Slow jobs run here once a night on main instead of in the merge queue. A
# failing job bisects its own command between its last green nightly and this
# commit; the report job files or updates one issue labelled nightly-failure,
# and the next green run of those jobs closes it.
run-name: >-
  ${{ inputs.jobs && format('nightly: jobs {0}', inputs.jobs) || 'nightly: all jobs' }}

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated jobs to run (empty runs all)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, itp-ubuntu24]
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          JOBS: ${{ inputs.jobs }}
        run: python3 scripts/nightly_triage.py plan --jobs "$JOBS"

  fortplot:
    name: Nightly fortplot
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'fortplot')
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fortran-lang/setup-fpm@v5
        with:
          fpm-version: 'v0.10.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install f90wrap
        run: pip install git+https://github.com/itpplasma/f90wrap@fix/directc-prototype-mod-name

      - name: Checkout lazy-fortran/fortplot
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fortplot
          ref: main
          path: thirdparty-test

      - name: Test fpm bind on lazy-fortran/fortplot
        id: run
        run: python3 scripts/nightly_triage.py run fortplot

      - name: Bisect the failure
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nightly_triage.py bisect fortplot --out "$RUNNER_TEMP/bisect.json"

      - uses: actions/upload-artifact@v4
        if: failure() && steps.run.outcome == 'failure'
        with:
          name: nightly-bisect-fortplot
          path: ${{ runner.temp }}/bisect.json
          if-no-files-found: ignore

  report:
    name: Report the failure
    needs: [plan, fortplot]
    if: failure()
    runs-on: [self-hosted, itp-ubuntu24]
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-bisect-*
          path: bisect
      - name: File or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/nightly_triage.py report --results bisect

  close:
    name: Close the nightly-failure issue
    needs: [plan, fortplot]
    if: >-
      always() && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, itp-ubuntu24]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Close the issue once its jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: ${{ inputs.jobs }}
        run: python3 scripts/nightly_triage.py success --jobs "$JOBS"
